[project]
name = "appmax-desafio"
version = "0.1.0"
description = "API de transferências entre usuários — desafio técnico Appmax"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# scripts soltos precisam ajustar o sys.path antes dos imports do app
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que exigem Postgres real (docker compose up db)",
]
filterwarnings = [
    # deprecacao interna do starlette/fastapi (TestClient), nao vem do nosso codigo
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
