[alembic]
script_location = alembic
# garante que o pacote `app` (importado pelo env.py) esteja no sys.path
# quando o alembic roda como console script (ex.: no container)
prepend_sys_path = .
# a URL do banco vem de app.config (variavel DATABASE_URL) via alembic/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
